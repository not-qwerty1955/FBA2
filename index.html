if(nx<AX+9||nx>AX+AW-9||ny<AY+9||ny>AY+AH-9)pm.dx=pm.dy=pm.wx=pm.wy=0;else{pm.x=nx;pm.y=ny}
let left=0;
for(const d of pm.dots){if(d.e)continue;if(Math.hypot(d.x-pm.x,d.y-pm.y)<10){d.e=1;pm.ww^=1;
if(d.p){pm.sc+=50;pm.fr=420;pm.combo=0;pm.gh.forEach(g=>{if(!g.eyes)g.fr=1});tone('sine',150,400,.3,.08)}
else{pm.sc+=10;wsw('sawtooth',pm.ww?200:480,pm.ww?480:200,.1,.09)}}else left++}
if(!left){pm.lv++;pmFill();pmGh();pm.x=144;pm.y=260;pm.dx=pm.dy=pm.wx=pm.wy=0;return}
if(pm.fr>0&&--pm.fr===0)pm.gh.forEach(g=>g.fr=0);
const sp=Math.min(1.9,1.1+pm.lv*.1);
for(const g of pm.gh){if(g.h>0){g.h--;continue}
let tx=pm.x,ty=pm.y,s=sp;
if(g.eyes){tx=144;ty=AY+AH/2-40;s=3.2;if(Math.hypot(g.x-tx,g.y-ty)<6){g.eyes=0;g.fr=0}}
else if(g.fr){tx=g.x*2-pm.x;ty=g.y*2-pm.y;s=sp*.55}
else if(g.i===1){tx+=pm.dx*60;ty+=pm.dy*60}
else if(g.i===2&&pm.t%240<80){tx=AX+AW-20;ty=AY+AH-20}
else if(g.i===3&&Math.hypot(g.x-pm.x,g.y-pm.y)<110){tx=AX+20;ty=AY+AH-20}
const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy)||1;g.dx=Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0;g.dy=g.dx?0:Math.sign(dy);
g.x=Math.max(AX+9,Math.min(AX+AW-9,g.x+dx/d*s));g.y=Math.max(AY+9,Math.min(AY+AH-9,g.y+dy/d*s));
if(Math.hypot(g.x-pm.x,g.y-pm.y)<13){
if(g.fr&&!g.eyes){g.eyes=1;g.fr=0;pm.combo++;pm.sc+=100*2**pm.combo;wsw('sawtooth',200,1600,.3,.08)}
else if(!g.eyes){pm.l--;[0,1,2,3,4].forEach(i=>wsw('square',900-i*120,700-i*110,.1,.07,i*.1));
if(pm.l<=0){pm.over=1;if(pm.sc>pmBest){pmBest=pm.sc;try{localStorage.setItem('fb_pmg',pmBest)}catch(e){}}}
else{pm.x=144;pm.y=260;pm.dx=pm.dy=pm.wx=pm.wy=0;pmGh();pm.fr=0}
return}}}}
