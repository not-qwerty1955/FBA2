const SCH=()=>plevel<2?[420,1200,420,1200,300,1200,300,1e9]:plevel<5?[420,1200,420,1200,300,62220,1,1e9]:[300,1200,300,1200,300,62400,1,1e9];
const home=()=>mode==='pac'?'pac':'game';
function pAdd(n){pscore+=n;if(pscore>pbest)pbest=pscore;if(!pbon&&S.bn<3&&pscore>=[1e4,15e3,2e4][S.bn]){pbon=1;plives++;[0,.1,.2,.3].forEach((d,k)=>tone('square',600+k*200,640+k*200,.1,.06,d))}}
function pNew(){pscore=0;plives=[1,2,3,5][S.lv];plevel=1;pbon=0;pLevel()}
function pLevel(){pel=MAP.map(r=>[...r].map(c=>c==='.'||c==='o'?c:' '));pdots=0;pel.forEach(r=>r.forEach(c=>{if(c!==' ')pdots++}));peat=0;pRound(0)}
function pRound(a){pac={x:13.5,y:23,dx:-1,dy:0};wd=[-1,0];
gh=[[13.5,11,'out',-1],[13.5,14,'house',0],[11.5,14,'house',0],[15.5,14,'house',0]].map((a,i)=>({i,x:a[0],y:a[1],st:a[2],dx:a[3],dy:0,eyes:0,fr:0}));
pmi=0;pmt=0;pfr=0;pfruit=null;pop=null;pidle=0;pfz=0;pcnt=0;pdie=a;pst=a?'GO':'READY';pc=a?110:0}
function setWd(d){wd=d;if(pst==='PLAY'&&d[0]===-pac.dx&&d[1]===-pac.dy&&(pac.dx||pac.dy)){pac.dx=d[0];pac.dy=d[1]}}
function pStart(){const n=!pscore&&plevel===1;pst='GO';pc=n?265:110;if(n)jingle()}
function ptap(){if(pst==='READY')pStart();else if(pst==='OVER'&&pc>40){pNew();pStart()}}
function step(e,sp,ch){let d=sp;while(d>1e-7){const atC=e.x===Math.round(e.x)&&e.y===Math.round(e.y);if(atC){ch(e);if(!e.dx&&!e.dy)return}
let dist=1;if(!atC)dist=e.dx>0?Math.ceil(e.x)-e.x:e.dx<0?e.x-Math.floor(e.x):e.dy>0?Math.ceil(e.y)-e.y:e.y-Math.floor(e.y);
const m=Math.min(d,dist);e.x+=e.dx*m;e.y+=e.dy*m;d-=m;if(m===dist){e.x=Math.round(e.x);e.y=Math.round(e.y)}
if(e.x<-1)e.x+=29;else if(e.x>28)e.x-=29}}
function bot(){const dg=gh.filter(g=>g.st==='out'&&!g.eyes&&!g.fr);let bd=1e9,bs=null;
for(const d of DR){const nx=pac.x+d[0],ny=pac.y+d[1];if(wallP(nx,ny))continue;let pen=0;for(const g of dg){const k=Math.abs(g.x-nx)+Math.abs(g.y-ny);if(k<6)pen+=(6-k)*25}
if(d[0]===-pac.dx&&d[1]===-pac.dy)pen+=2;const q=[[nx,ny,1]],seen=new Set([pac.x+','+pac.y,nx+','+ny]);let f=60;
while(q.length){const[x,y,n]=q.shift(),c=pel[y]&&pel[y][x];if(c==='.'||c==='o'){f=n;break}for(const e of DR){const ax=x+e[0],ay=y+e[1],k=ax+','+ay;if(ax<-1||ax>28||seen.has(k)||wallP(ax,ay))continue;seen.add(k);q.push([ax,ay,n+1])}}
if(f+pen<bd){bd=f+pen;bs=d}}if(bs)wd=bs}
function chP(e){if(cheat)bot();if(!wallP(e.x+wd[0],e.y+wd[1])){e.dx=wd[0];e.dy=wd[1]}else if(wallP(e.x+e.dx,e.y+e.dy))e.dx=e.dy=0}
function tgt(g){if(g.eyes)return[13.5,11];const px=Math.round(pac.x),py=Math.round(pac.y),el=g.i===0&&elroy();
if(pmi%2===0&&!el)return SC[g.i];

function chG(g){let o=DR.filter(d=>!(d[0]===-g.dx&&d[1]===-g.dy)&&!wallP(g.x+d[0],g.y+d[1]));if(!o.length)o=[[-g.dx,-g.dy]];let d;
if(g.fr&&!g.eyes)d=o[(Math.random()*o.length)|0];else{const t=tgt(g);let b=1e9;for(const q of o){const dd=(g.x+q[0]-t[0])**2+(g.y+q[1]-t[1])**2;if(dd<b){b=dd;d=q}}}g.dx=d[0];g.dy=d[1]}
function gsp(g,s){if(g.eyes)return 1.6;let v=s.gn+(g.i===0?.05*elroy():0);if(g.y===14&&(g.x<5.5||g.x>21.5))v=s.gt;else if(g.fr)v=s.gf;return v*DF[S.diff]}
function gUpd(g,s){
if(g.st==='house'){g.y=14+Math.sin(pg/6+g.i)*.3;return}
if(g.st==='leave'){if(Math.abs(g.x-13.5)>.06)g.x+=g.x<13.5?.05:-.05;else{g.x=13.5;g.y-=.05;if(g.y<=11){g.y=11;g.st='out';g.dx=-1;g.dy=0}}return}
if(g.st==='enter'){if(Math.abs(g.x-13.5)>.06)g.x+=g.x<13.5?.07:-.07;else{g.x=13.5;g.y+=.1;if(g.y>=14){g.y=14;g.st='leave';g.eyes=0;g.fr=0}}return}
step(g,gsp(g,s)*KS,chG);if(g.eyes&&g.y===11&&(g.x===13||g.x===14))g.st='enter'}
function wsw(type,f1,f2,d,v,t0){if(!A||!S.snd)return;const t=A.currentTime+(t0||0),o=A.createOscillator(),g=A.createGain(),f=A.createBiquadFilter();v*=S.vol;o.type=type;f.type='lowpass';f.frequency.value=1800;
o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.setValueAtTime(v,t+d-.012);g.gain.linearRampToValueAtTime(0,t+d);
o.connect(f);f.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d+.01)}
let sir=null,sirG=null;
function sirOff(){if(sirG&&A)sirG.gain.setTargetAtTime(0,A.currentTime,.02)}
function pSiren(){if(!A||!S.snd||pst!=='PLAY'||pfz>0){sirOff();return}
if(!sir){sir=A.createOscillator();sirG=A.createGain();sirG.gain.value=0;sir.type='triangle';sir.connect(sirG);sirG.connect(A.destination);sir.start()}
const t=A.currentTime;let f;
if(gh.some(g=>g.eyes))f=700+Math.abs((pg%12)-6)/6*300;
else if(pfr>0)f=110+(pg%10)*14;
else f=[250,285,320,360,400][Math.min(4,((244-pdots)/50)|0)]+Math.abs((pg%36)-18)/18*110;
sir.frequency.setValueAtTime(f,t);sirG.gain.setTargetAtTime(.07*S.vol,t,.02)}
function pDeath(){for(let i=0;i<10;i++)wsw('square',1000-i*85,700-i*70,.11,.07,.55+i*.1);[0,.09,.18].forEach(d=>wsw('square',500,120,.07,.07,1.6+d))}
function jingle(){const a=[494,988,740,622,988,740,622],b=[523,1047,784,659,1047,784,659],c=[622,659,698,698,740,784,784,831,880,988],D=[.1,.1,.1,.1,.14,.18,.3];let t=0;
[a,b,a].forEach(p=>{p.forEach((f,i)=>{tone('square',f,f,D[i],.05,t);t+=D[i]+.01});t+=.06});c.forEach(f=>{tone('square',f,f,.07,.05,t);t+=.075});tone('square',988,988,.25,.05,t)}
function pUpd(){if(scr!=='pac'){sirOff();return}pg++;pSiren();
if(pst==='GO'){if(--pc<=0)pst='PLAY';return}
if(pst==='DIE'){if(++pc>150){plives--;try{localStorage.setItem('fb_pac',pbest)}catch(e){}if(plives<=0){pst='OVER';pc=0}else pRound(1)}return}
if(pst==='CLEAR'){if(++pc>110){plevel++;pLevel();pst='GO';pc=110}return}
if(pst==='OVER'){pc++;return}
if(pst!=='PLAY')return;
if(pfz>0){pfz--;if(pop)pop.t--;if(!pfz)pop=null;return}
const s=SP();
if(pfr>0){if(--pfr===0)gh.forEach(g=>g.fr=0)}else{if(++pmt>=SCH()[pmi]){pmi++;pmt=0;gh.forEach(g=>{if(g.st==='out'&&!g.eyes){g.dx=-g.dx;g.dy=-g.dy}})}}
step(pac,(pfr>0?s.pf:s.pn)*KS,chP);
const c=Math.round(pac.x),r=Math.round(pac.y),ch=pel[r]&&pel[r][c];
if(ch==='.'||ch==='o'){pel[r][c]=' ';pdots--;peat++;pcnt++;pidle=0;pwk^=1;
if(ch==='.'){pAdd(10);pfz=1;wsw('sawtooth',pwk?200:480,pwk?480:200,.1,.09)}
else{pAdd(50);pfz=3;pcombo=0;const t=FT[Math.min(plevel-1,18)]*150;gh.forEach(g=>{if(g.st==='out'&&!g.eyes){g.dx=-g.dx;g.dy=-g.dy;if(t)g.fr=1}});pfr=t}
if(peat===70||peat===170)pfruit={t:570}}
if(pfruit){if(--pfruit.t<=0)pfruit=null;else if(Math.hypot(pac.x-13.5,pac.y-17)<.7){pAdd(FP[Math.min(plevel-1,12)]);pop={x:13.5,y:17,v:FP[Math.min(plevel-1,12)],t:50};pfz=50;pfruit=null;tone('square',500,1000,.09,.07);tone('square',700,1400,.12,.07,.1)}}
pidle++;const h=gh.filter(g=>g.st==='house');
if(h.length){const g=h[0],th=pdie?[0,7,10,15][g.i]:[[0,0,30,60],[0,0,0,50],[0,0,0,0]][Math.min(plevel-1,2)][g.i];if(pcnt>=th||pidle>(plevel<5?240:180)){g.st='leave';pcnt=0;pidle=0}}
gh.forEach(g=>gUpd(g,s));
for(const g of gh){if(g.st==='out'&&!g.eyes&&Math.hypot(g.x-pac.x,g.y-pac.y)<.6){
if(g.fr){g.fr=0;g.eyes=1;pcombo++;const v=100*2**pcombo;pAdd(v);pop={x:g.x,y:g.y,v,t:50};pfz=50;wsw('sawtooth',200,1600,.3,.08)}
else{pst='DIE';pc=0;sirOff();pDeath();return}}}
if(pdots<=0){pst='CLEAR';pc=0;try{localStorage.setItem('fb_pac',pbest)}catch(e){}sirOff()}}
const MY=104,px=x=>x*TW+TW/2,py=y=>MY+y*TW+TW/2;
const PK2={};
function dPac(x,y,a,m,col,sz){const k=a.toFixed(2)+m.toFixed(2)+col;let c=PK2[k];if(!c){c=PK2[k]=document.createElement('canvas');c.width=c.height=13;const b=c.getContext('2d');b.fillStyle=col;
for(let j=0;j<13;j++)for(let i=0;i<13;i++){const dx=i-6,dy=j-6;if(dx*dx+dy*dy>41)continue;if(dx||dy){let d=Math.atan2(dy,dx)-a;d=Math.abs(Math.atan2(Math.sin(d),Math.cos(d)));if(d<m)continue}b.fillRect(i,j,1,1)}}
const z=sz||16.7;ctx.drawImage(c,x-z/2,y-z/2,z,z)}
function dF(x,y,k){ctx.fillStyle=FC[FI[Math.min(k-1,12)]];ctx.beginPath();ctx.arc(x,y+1,4.5,0,7);ctx.fill();ctx.strokeStyle='#4c4';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x,y-3);ctx.lineTo(x+3,y-7);ctx.stroke()}
const GK={};
function dG(g,x,y){const fr=g.fr&&!g.eyes,fl=fr&&pfr<(FT[Math.min(plevel-1,18)]<=1?3:5)*28&&((pfr/14)|0)%2===1,f=(pg>>3)&1,key=[g.i,g.eyes,fr?(fl?2:1):0,f,g.dx,g.dy].join();let c=GK[key];
if(!c){c=GK[key]=document.createElement('canvas');c.width=c.height=14;const b=c.getContext('2d'),R=(col,x,y,w,h)=>{b.fillStyle=col;b.fillRect(x,y,w,h)};
if(!g.eyes){const col=fr?(fl?'#fff':'#2121de'):GC[g.i];['....######....','..##########..','.############.','##############','##############','##############','##############','##############','##############','##############','##############','##############','##############',f?'##.###..###.##':'###..####..###'].forEach((r,yy)=>{for(let xx=0;xx<14;xx++)if(r[xx]==='#')R(col,xx,yy,1,1)})}
if(fr){const fc=fl?'#f00':'#ffb8ae';R(fc,3,5,2,2);R(fc,9,5,2,2);for(let xx=1;xx<13;xx++)R(fc,xx,((xx>>1)&1)?9:10,1,1)}
else{[2,8].forEach(x0=>{const y0=3;R('#fff',x0+1,y0,2,1);R('#fff',x0,y0+1,4,3);R('#fff',x0+1,y0+4,2,1);
const o=g.dx>0?[2,2]:g.dy<0?[1,0]:g.dy>0?[1,3]:[0,2];R('#2a50d8',x0+o[0],y0+o[1],2,2)})}}
ctx.drawImage(c,x-9,y-9,18,18)}
function pDraw(){btns=[];ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.imageSmoothingEnabled=false;
ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
T('1UP',44,MY-34,12,'#fff',0);T(pscore,44,MY-18,13,'#fff',0);T('HIGH SCORE',144,MY-34,12,'#fff',0);T(pbest,144,MY-18,13,'#fff',0);
ctx.drawImage(pst==='CLEAR'&&((pc/12)|0)%2?mzw:mzb,0,MY);
ctx.fillStyle='#ffb8ae';pel.forEach((row,y)=>row.forEach((c,x)=>{if(c==='.')ctx.fillRect(px(x)-1,py(y)-1,2,2);else if(c==='o'&&(pst!=='PLAY'||pg%24<14)){ctx.beginPath();ctx.arc(px(x),py(y),4,0,7);ctx.fill()}}));
if(pfruit)dF(px(13.5),py(17),plevel);
const X=px(pac.x),Y=py(pac.y),pcol=S.ci?COLS[S.ci][0]:'#ffee3a';if(pac.dx||pac.dy)pfa=Math.atan2(pac.dy,pac.dx);
if(!(pst==='DIE'&&pc>=30)||pc<120){
if(pst==='DIE'&&pc>=30)dPac(X,Y,-1.5708,Math.min(3.14,(pc-30)/90*3.14),pcol);
else if(pst!=='OVER'){if(S.skin)sprAt(S.skin,0,X,Y,.55);else dPac(X,Y,pfa,pst==='PLAY'&&(pac.dx||pac.dy)?[.62,.32,0,.32][(pg>>1)&3]:.32,pcol)}}
if(!(pst==='DIE'&&pc>=30)&&pst!=='CLEAR'&&pst!=='OVER')gh.forEach(g=>dG(g,px(g.x),py(g.y)));
if(pop&&pop.t>0)T(pop.v,px(pop.x),py(pop.y)+3,10,'#0ff',0);
const ty=py(17)+4;
if(pst==='READY'||pst==='GO')T('READY!',144,ty,15,'#ff0',0);
if(pst==='READY'){T('TAP TO START',144,ty+22,11,'#fff',0);
if(plevel===1&&!pscore){ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(24,MY+95,240,80);const N=S.gn?AN:NN;N.forEach((n,i)=>{ctx.fillStyle=GC[i];ctx.beginPath();ctx.arc(46,MY+110+i*18,5,0,7);ctx.fill();T(n[0]+'  '+n[1],62,MY+114+i*18,11,GC[i],0,'left')})}}
if(pst==='OVER'){T('GAME OVER',144,ty,15,'#f00',0);if(pc>40)T('TAP TO RESTART',144,ty+22,11,'#fff',0)}
for(let i=0;i<plives-1&&i<6;i++)dPac(18+i*18,MY+TW*31+13,Math.PI,.5,pcol,14);
for(let i=0;i<7;i++){const l=plevel-i;if(l>=1)dF(272-i*16,MY+TW*31+13,l)}
ui()}
let sw=null;
addEventListener('pointerdown',e=>{sw=[e.clientX,e.clientY]});
addEventListener('pointermove',e=>{if(scr!=='pac'||!sw)return;const dx=e.clientX-sw[0],dy=e.clientY-sw[1];if(Math.hypot(dx,dy)>16){cheat=false;setWd(Math.abs(dx)>Math.abs(dy)?(dx>0?DR[3]:DR[1]):(dy>0?DR[2]:DR[0]));sw=[e.clientX,e.clientY]}});
addEventListener('pointerup',()=>{sw=null});
pLevel();

let lt=0,acc=0;
function loop(t){acc+=Math.min(t-lt,100);lt=t;while(acc>=16.667){(scr==='mini'?mgUpd:mode==='pac'?pUpd:upd)();acc-=16.667}scr==='mini'?drawMini():mode==='pac'?pDraw():draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
